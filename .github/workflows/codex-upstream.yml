name: Codex upstream watch

# The native Codex package tracks one official release. This job only watches:
# it notices the next stable release, checks whether the source patches still
# merge onto it, and keeps one issue per upstream version with the result. The
# release itself is one local command on a maintainer's machine,
# `codex/model-guard/native/release.py`, which does the merge, the build, the
# checks and the publication there; nothing is compiled on GitHub.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pinned Codex with upstream's latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(python3 -c 'import json; print(json.load(open("codex/model-guard/native/release.json"))["codex_version"])')
          latest=$(gh release list -R openai/codex --exclude-pre-releases --limit 30 --json tagName -q '.[].tagName' | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^rust-v//')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned $pinned, upstream latest $latest"
      - name: Try the patches on the new release
        if: steps.compare.outputs.latest != steps.compare.outputs.pinned
        run: |
          set +e
          git init --quiet upstream
          git -C upstream fetch --quiet --depth=1 https://github.com/openai/codex.git "refs/tags/rust-v${{ steps.compare.outputs.latest }}:refs/tags/rust-v${{ steps.compare.outputs.latest }}"
          git -C upstream fetch --quiet --depth=1 https://github.com/openai/codex.git "refs/tags/rust-v${{ steps.compare.outputs.pinned }}:refs/tags/rust-v${{ steps.compare.outputs.pinned }}"
          git -C upstream checkout --quiet --detach "rust-v${{ steps.compare.outputs.latest }}"
          {
            echo "| Patch | Result on rust-v${{ steps.compare.outputs.latest }} |"
            echo "|---|---|"
            for patch in codex/model-guard/native/000[1236]-*.patch; do
              if git -C upstream apply --3way --whitespace=nowarn "$PWD/$patch" >/dev/null 2>&1; then
                echo "| \`$(basename "$patch")\` | merges |"
              else
                echo "| \`$(basename "$patch")\` | conflicts: $(git -C upstream diff --name-only --diff-filter=U | tr '\n' ' ') |"
              fi
              git -C upstream reset --quiet --hard
            done
            echo
            echo "Schemas (0004) and the lockfile (0005) are regenerated for every release, so they are not checked."
          } > result.md
          cat result.md
      - name: Keep one issue per upstream release
        if: steps.compare.outputs.latest != steps.compare.outputs.pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Codex ${{ steps.compare.outputs.latest }} is out; the native package is on ${{ steps.compare.outputs.pinned }}"
          {
            echo "Upstream published \`rust-v${{ steps.compare.outputs.latest }}\` and \`native/release.json\` still pins ${{ steps.compare.outputs.pinned }}."
            echo
            cat result.md
            echo
            echo "Release it from a checkout on a machine with Docker: \`python3 codex/model-guard/native/release.py\` (add \`--dry-run\` to build and verify without publishing). When a patch conflicts, the command stops with the files listed; resolve them in its work tree, commit each patch under its own name, and run again with \`--resume\`."
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
