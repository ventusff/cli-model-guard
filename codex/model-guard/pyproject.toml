[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-guard"
version = "1.10.0"
description = "Native Codex routing evidence, reasoning anomalies and account status"
requires-python = ">=3.12"
dependencies = ["websockets==17.1"]
license = "MIT"

[project.scripts]
model-guard-codex = "model_guard.cli:main"

[tool.setuptools.packages.find]
include = ["model_guard*"]
